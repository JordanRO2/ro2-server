version: 2
updates:
  # .NET dependencies (central package management: Directory.Packages.props).
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # One PR per weekly run for routine bumps, so the queue stays small.
      dotnet-dependencies:
        patterns:
          - "*"

  # GitHub Actions used by the CI and CodeQL workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all action bumps. CodeQL's init and analyze steps must move in
      # lockstep (a mixed v3/v4 pair fails the analysis), so never split them.
      actions:
        patterns:
          - "*"
